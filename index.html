const Q2017=[
{c:8,y:"2017",n:1,q:"The combined age of A and B is 39, B and C is 40, C and D is 38 and D and E is 44. The total of the ages of all the five is 105. Which of the following can be the age of the youngest member of the given five?",o:["10","12","13","16"],a:3,
 h:"Use the total of all five (105). If you take away two pairs, the one person left over is easy to find. Then work out the others one at a time.",
 f:"Total of all five − (two pairs that don't overlap) = the one person left out.",
 s:["E = 105 − (A+B) − (C+D) = 105 − 39 − 38 = 28.","A = 105 − (B+C) − (D+E) = 105 − 40 − 44 = 21.","B = 39 − 21 = 18, C = 40 − 18 = 22, D = 38 − 22 = 16.","Ages: A 21, B 18, C 22, D 16, E 28 → youngest is <b>16</b>."]},
{c:11,y:"2017",n:2,q:`A water tank is ${fr("5","6")} full. When 30 litres of water are removed from the tank, the tank is ${fr("4","5")} full. How much water does the tank hold when full?`,o:["500 litres","900 litres","700 litres","1000 litres"],a:1,
 h:"The 30 litres removed is the DIFFERENCE between the two fractions. Subtract 5/6 − 4/5 (use 30 as the common denominator).",
 f:"If a fraction of the whole is a known amount, whole = amount ÷ fraction.",
 s:[`${fr("5","6")} − ${fr("4","5")} = ${fr("25","30")} − ${fr("24","30")} = ${fr("1","30")}.`,`${fr("1","30")} of the tank = 30 litres.`,"Full tank = 30 × 30 = <b>900 litres</b>."]},
{c:15,y:"2017",n:3,q:"A wholesaler allows a discount of 20% on the list price to a retailer. The retailer sells at 8% discount on the list price. The profit % of the retailer is:",o:["20%","12%","15%","10%"],a:2,
 h:"Pick an easy list price like Rs.100. What does the retailer PAY (after 20% off)? What does the retailer RECEIVE (after 8% off)?",
 f:"Profit % = (SP − CP) ÷ CP × 100. Choose list price = 100 to make it easy.",
 s:["Let the list price = Rs.100.","Retailer's cost = 100 − 20 = Rs.80.","Retailer's selling price = 100 − 8 = Rs.92.","Profit = 92 − 80 = 12 → 12 ÷ 80 × 100 = <b>15%</b>."]},
{c:11,y:"2017",n:4,q:`What fraction of the rectangle is shaded?${gridFig17}`,o:[fr("1","2"),fr("2","5"),fr("1","4"),fr("1","3")],a:3,
 h:"The rectangle is 6 squares wide and 3 squares tall. The shaded triangle starts at the bottom-left corner, has its base on the bottom line, and reaches the top-right corner. Count its base and height in squares.",
 f:"Triangle area = ½ × base × height. Fraction shaded = shaded area ÷ whole rectangle area.",
 s:["Rectangle: 6 × 3 = 18 squares.","Triangle base on the bottom = 4 squares (from the left corner to the 4th line). Height = 3 squares.","Triangle area = ½ × 4 × 3 = 6 squares.",`Fraction = ${fr("6","18")} = <b>${fr("1","3")}</b>.`]},
{c:18,y:"2017",n:5,q:"A clock is showing 11:00 a.m. now. When the hour hand has turned through 165°, what will be the time?",o:["2:05 p.m.","4:30 p.m.","12:30 p.m.","5:30 p.m."],a:1,
 h:"The hour hand turns 30° in every hour. How many hours is 165°?",
 f:"Hour hand: 30° per hour. Hours passed = angle ÷ 30.",
 s:["165 ÷ 30 = 5.5 hours = 5 hours 30 minutes.","11:00 a.m. + 5 h 30 min = <b>4:30 p.m.</b>"]},
{c:8,y:"2017",n:6,q:"The sum of the ages of four children, Anil, Bunty, Chetan and David is 20. David is 5 years older than Chetan, and 3 years older than Bunty. Anil is 3 years younger than Chetan. How old is Anil?",o:["1","4","5","6"],a:0,
 h:"Write everyone's age in terms of Chetan's age. Then add all four and set it equal to 20.",
 f:"Pick one person as the base (Chetan = c), express others using c, then solve.",
 s:["Chetan = c. David = c + 5. Bunty = David − 3 = c + 2. Anil = c − 3.","Sum: c + (c + 5) + (c + 2) + (c − 3) = 4c + 4 = 20.","4c = 16 → c = 4.","Anil = 4 − 3 = <b>1</b> year old."]},
{c:17,y:"2017",n:7,q:"A seagull travelled 16500 miles from Finland to Australia. It travelled at a rate of 125 miles per day. In how many days did the seagull reach Australia?",o:["145","125","132","150"],a:2,
 h:"Time = Distance ÷ Speed. Try dividing 16500 by 125 — or divide both by 25 first to make it easier.",
 f:"Time = Distance ÷ Speed.",
 s:["Days = 16500 ÷ 125.","Divide both by 25: 660 ÷ 5 = 132.","Answer: <b>132 days</b>."]},
{c:13,y:"2017",n:8,q:"A piece of work can be done by 72 men in 40 hours. How many hours will 9 men take to complete the same work?",o:["360 hours","320 hours","180 hours","200 hours"],a:1,
 h:"Fewer men take MORE time. Total work = men × hours stays the same. 9 men is how many times fewer than 72 men?",
 f:"Men × Hours = constant (inverse proportion).",
 s:["Total work = 72 × 40 = 2880 man-hours.","Time for 9 men = 2880 ÷ 9 = <b>320 hours</b>.","(72 men is 8 times 9 men, so 8 times the time: 40 × 8 = 320 ✓)"]},
{c:16,y:"2017",n:9,q:"What will be the simple interest on Rs.3000 at 12% p.a. for 5 years?",o:["Rs.1800","Rs.600","Rs.1500","Rs.3600"],a:0,
 h:"Use SI = P × R × T ÷ 100. 1% of 3000 is Rs.30.",
 f:"SI = (P × R × T) ÷ 100.",
 s:["1% of 3000 = 30.","Per year at 12% = 12 × 30 = 360.","For 5 years = 5 × 360 = <b>Rs.1800</b>."]},
{c:7,y:"2017",n:10,q:"Which set of signs of operations should be replaced in the boxes so that the equation is true: 10 □ 6 □ 4 □ 6 = 28",o:["+ × ÷","+ − ÷","+ × −","None of these"],a:2,
 h:"Try each option using BODMAS: multiply/divide first, then add/subtract.",
 f:"Test each option one by one.",
 s:["Option 1: 10 + 6 × 4 ÷ 6 = 10 + 24 ÷ 6 = 10 + 4 = 14 ✗","Option 2: 10 + 6 − 4 ÷ 6 = not 28 ✗","Option 3: 10 + 6 × 4 − 6 = 10 + 24 − 6 = <b>28</b> ✓"]},
{c:18,y:"2017",n:11,q:`The figure shows three rectangles. What is the value of 'x'?${rectFig17}`,o:["108°","72°","100°","92°"],a:0,
 h:"The three rectangles make a triangle in the middle. Two of its angles are 43° and 29°. What is the sum of all three angles of a triangle?",
 f:"Angles of a triangle add up to 180°.",
 s:["Inside triangle: 43° + 29° + x = 180°.","43 + 29 = 72.","x = 180° − 72° = <b>108°</b>."]},
{c:14,y:"2017",n:12,q:"A clock was on sale last month for Rs.10800, but this month its price was reduced to Rs.8640. What percentage discount is this?",o:["12.5%","15%","20%","25%"],a:2,
 h:"Find how many rupees the price dropped by. Then compare with the OLD price: drop ÷ old price × 100.",
 f:"Discount % = (Discount ÷ Original price) × 100.",
 s:["Reduction = 10800 − 8640 = Rs.2160.","2160 ÷ 10800 × 100 = <b>20%</b>."]},
{c:10,y:"2017",n:13,q:"How many two-digit numbers are there which are divisible by 2, 3 and 4?",o:["90","8","45","12"],a:1,
 h:"A number divisible by 2, 3 and 4 is a multiple of their LCM. Find the LCM, then list the two-digit multiples.",
 f:"LCM of 2, 3, 4 = 12. List multiples of 12 between 10 and 99.",
 s:["LCM of 2, 3 and 4 = <b>12</b>.","Two-digit multiples of 12: 12, 24, 36, 48, 60, 72, 84, 96.","Count = <b>8</b>."]},
{c:12,y:"2017",n:14,q:"A man bought 21 oranges. Which of the following decimals represents the same?",o:["2.1 dozen","1.5 dozen","1.25 dozen","1.75 dozen"],a:3,
 h:"1 dozen = 12. Divide 21 by 12 and write as a decimal. 21 ÷ 12 = 1 and 9 left over...",
 f:"Number of dozens = number of items ÷ 12.",
 s:["21 ÷ 12 = 1 remainder 9.",`9 ÷ 12 = ${fr("3","4")} = 0.75.`,"So 21 oranges = <b>1.75 dozen</b>."]},
{c:7,y:"2017",n:15,q:"Simplify: 8 + 6 ÷ 2 − [2 × 3 − {2 − (3 + 2)}]",o:["3","5","2","1"],a:2,
 h:"Start from the INNERMOST bracket ( ), then { }, then [ ]. Do 6 ÷ 2 outside separately.",
 f:"Bracket order: ( ) → { } → [ ]. Then BODMAS.",
 s:["(3 + 2) = 5.","{2 − 5} = −3.","[2 × 3 − (−3)] = [6 + 3] = 9.","8 + 6 ÷ 2 − 9 = 8 + 3 − 9 = <b>2</b>."]},
{c:4,y:"2017",n:16,q:"Which of the following is a perfect square number?",o:["10025","11025","1025","All are perfect squares"],a:1,
 h:"Find the square roots nearby: 100² = 10000 and 105² = 11025. Check which numbers land exactly.",
 f:"A perfect square has a whole number square root. Use 100² = 10000, 101² = 10201.",
 s:["10025 lies between 100² = 10000 and 101² = 10201 ✗.","1025 lies between 32² = 1024 and 33² = 1089 ✗.","105 × 105 = <b>11025</b> ✓."]},
{c:16,y:"2017",n:17,q:"In how many years will Rs.2000 amount to Rs.3500 at simple interest of 5% p.a.?",o:["15 years","5 years","12 years","10 years"],a:0,
 h:"Amount − Principal = interest. Find how much interest comes each year (5% of 2000), then divide.",
 f:"T = SI × 100 ÷ (P × R).",
 s:["SI needed = 3500 − 2000 = Rs.1500.","Interest per year = 5% of 2000 = Rs.100.","Years = 1500 ÷ 100 = <b>15 years</b>."]},
{c:19,y:"2017",n:18,q:"The perimeter of a square and an equilateral triangle are the same. If the side of the triangle is 8 cm, then the side of the square is:",o:["8 cm","24 cm","6 cm","12 cm"],a:2,
 h:"Find the triangle's perimeter (3 equal sides). Share that perimeter equally among the 4 sides of the square.",
 f:"Equilateral triangle = 3 × side. Square = 4 × side.",
 s:["Triangle perimeter = 3 × 8 = 24 cm.","Square perimeter = 24 cm → side = 24 ÷ 4 = <b>6 cm</b>."]},
{c:20,y:"2017",n:19,q:"The breadth of a rectangle is half the length of the rectangle. If the perimeter of the rectangle is 48 cm, then its area is:",o:["288 sq.cm","128 sq.cm","256 sq.cm","196 sq.cm"],a:1,
 h:"If breadth = 1 part, length = 2 parts. Perimeter = 2 × (L + B) = 2 × 3 parts. Find one part first.",
 f:"Perimeter = 2(L + B). Area = L × B.",
 s:["L + B = 48 ÷ 2 = 24. With L = 2B: 3B = 24 → B = 8 cm, L = 16 cm.","Area = 16 × 8 = <b>128 sq.cm</b>."]},
{c:8,y:"2017",n:20,q:"If 2x + 1 = 8, then 4x + 1 = ?",o:["9","17","16","15"],a:3,
 h:"You don't need x. 4x is double 2x. First find 2x from the equation.",
 f:"4x = 2 × (2x).",
 s:["2x + 1 = 8 → 2x = 7.","4x = 2 × 7 = 14.","4x + 1 = 14 + 1 = <b>15</b>."]},
{c:14,y:"2017",n:21,q:"In 1976 it was estimated that there were 250000 lions in Africa. Over the past 40 years this figure has decreased by 90%. What is the current estimate for the number of lions in Africa?",o:["25000","100000","160000","225000"],a:0,
 h:"If 90% are gone, what percent are LEFT? Find that percent of 250000. (Don't pick 225000 — that's the number that disappeared.)",
 f:"Remaining % = 100% − decrease %.",
 s:["Remaining = 100% − 90% = 10%.","10% of 250000 = 25000.","Current lions = <b>25000</b>."]},
{c:13,y:"2017",n:22,q:"A worker gets Rs.504 for 7 days of work. How many days should he work to get Rs.792?",o:["9 days","8 days","11 days","12 days"],a:2,
 h:"Find the pay for ONE day first. Then see how many days make Rs.792.",
 f:"Unitary method: 1 day's pay = total ÷ days.",
 s:["Pay per day = 504 ÷ 7 = Rs.72.","Days for Rs.792 = 792 ÷ 72 = <b>11 days</b>."]},
{c:18,y:"2017",n:23,q:"A man is cycling towards the North-East direction. He turns to his left and is now cycling towards West direction. How many degrees to his left did he turn?",o:["90°","145°","135°","180°"],a:2,
 h:"Turning LEFT means anticlockwise. Go from North-East to North, then North-West, then West, counting 45° each step.",
 f:"Each step between neighbouring directions (N, NE, E …) is 45°.",
 s:["North-East → North = 45° (to the left).","North → North-West = another 45° (total 90°).","North-West → West = another 45° (total <b>135°</b>)."]},
{c:11,y:"2017",n:24,q:`What is the value of: ${fr(`${fr("2","3")} + ${fr("1","3")}`,`${fr("2","3")} − ${fr("1","3")}`)}`,o:[fr("1","2"),"1",fr("1","3"),"3"],a:3,
 h:"Work out the top and the bottom separately. The fraction line means 'top ÷ bottom'.",
 f:"Add/subtract fractions with the same denominator by combining numerators.",
 s:[`Top: ${fr("2","3")} + ${fr("1","3")} = ${fr("3","3")} = 1.`,`Bottom: ${fr("2","3")} − ${fr("1","3")} = ${fr("1","3")}.`,`1 ÷ ${fr("1","3")} = 1 × 3 = <b>3</b>.`]},
{c:6,y:"2017",n:25,q:"A two-digit number ♣9 is multiplied by a three-digit number ♣♣3. The digits in the ♣ place are not necessarily the same. Which of the following can be the product of the given two numbers?",o:["1907","957","46847","756927"],a:2,
 h:"Check the LAST digit first (9 × 3). Then check the smallest and largest possible products to rule out options that are too small or too big.",
 f:"Smallest product = 19 × 103 = 1957. Largest product = 99 × 993 = 98,307.",
 s:["Last digit: 9 × 3 = 27 → ends in 7 (all options end in 7, so size must decide).","1907 and 957 are smaller than the smallest possible product 1957 ✗.","756927 is bigger than the largest possible product (about 98,300) ✗.","Only <b>46847</b> is left ✓ (it equals 79 × 593)."]},
{c:12,y:"2017",n:26,q:"Given that 21 × 24 = 504, then 2.1 × 0.24 = ?",o:["0.0504","5.04","50.4","0.504"],a:3,
 h:"Count the decimal places: 2.1 has 1 and 0.24 has 2. Put that many decimal places in 504.",
 f:"Decimal places in the answer = total decimal places in the numbers multiplied.",
 s:["2.1 has 1 decimal place, 0.24 has 2 → total 3 decimal places.","504 with 3 decimal places = <b>0.504</b>."]},
{c:10,y:"2017",n:27,q:"Dog A barks every 5 minutes, Dog B barks every 8 minutes and Dog C barks every 12 minutes. They started barking at 11:30 p.m. and continued barking the whole night. Later that night Mr. John woke up when the three dogs barked at the same time (making a very loud noise). What time did Mr. John wake up?",o:["1:00 a.m.","1:30 p.m.","1:30 a.m.","2:30 p.m."],a:2,
 h:"They bark together again after the LCM of 5, 8 and 12 minutes. Then add that time to 11:30 p.m.",
 f:"LCM tells when repeating events happen together again.",
 s:["LCM of 5, 8, 12 = <b>120 minutes</b> = 2 hours.","11:30 p.m. + 2 hours = <b>1:30 a.m.</b>"]},
{c:1,y:"2017",n:28,q:"If (x + 37) is an even number, then the 17th odd number coming after it is represented by:",o:["(x + 54)","(x + 53)","(x + 71)","(x + 70)"],a:3,
 h:"Try a real even number, say 10. The odd numbers after it are 11, 13, 15 … What is the 17th one? Compare with 10.",
 f:"After an even number e: nth odd number = e + 1 + (n − 1) × 2.",
 s:["Let e = x + 37 (even).","17th odd number after e = e + 1 + (16 × 2) = e + 33.","= (x + 37) + 33 = <b>x + 70</b>."]},
{c:17,y:"2017",n:29,q:"A motorcycle is moving at the rate of 30 m/s. Its speed in km/hr is:",o:["90 km/hr","60 km/hr","108 km/hr","45 km/hr"],a:2,
 h:"To change m/s into km/h multiply by 18 ÷ 5 (or by 3.6).",
 f:"m/s → km/h: × 18/5.",
 s:["30 × 18 ÷ 5 = 30 ÷ 5 × 18 = 6 × 18 = <b>108 km/hr</b>."]},
{c:19,y:"2017",n:30,q:"The length of a rectangle is (4a + 3b) and the breadth is (3a − b). Find its perimeter.",o:["(7a + 2b)","(14a + 4b)","(14a − 2b)","None of these"],a:1,
 h:"First add the length and breadth (combine like terms). Then multiply by 2.",
 f:"Perimeter = 2 × (L + B).",
 s:["L + B = (4a + 3b) + (3a − b) = 7a + 2b.","Perimeter = 2 × (7a + 2b) = <b>14a + 4b</b>."]},
{c:13,y:"2017",n:31,q:"A dozen pencils cost Rs.18. How much would you pay for 18 pencils?",o:["Rs.12","Rs.18","Rs.30","Rs.27"],a:3,
 h:"1 dozen = 12 pencils. Find the cost of one pencil first.",
 f:"Unitary method: find the value of 1.",
 s:["12 pencils = Rs.18 → 1 pencil = Rs.1.50.","18 pencils = 18 × 1.50 = <b>Rs.27</b>."]},
{c:5,y:"2017",n:32,q:`What is the value of: ${fr("66 + 77 + 88 + 99","11 + 22 + 33 + 44")}`,o:["2.5","3","3.5","4"],a:1,
 h:"Add up the four numbers on the top, then add up the four numbers at the bottom. Then divide the top total by the bottom total.",
 f:"Add the numbers on top, add the numbers at the bottom, then divide.",
 s:["Top = 66 + 77 + 88 + 99 = 330.","Bottom = 11 + 22 + 33 + 44 = 110.","330 ÷ 110 = <b>3</b>."]},
{c:1,y:"2017",n:33,q:"Form the greatest odd number using the digits 7, 5, 2, 0 and 4 each only once.",o:["75420","54207","74205","70425"],a:2,
 h:"An odd number must END in an odd digit (7 or 5). For the greatest number the biggest digits must come first. Compare ending in 5 and ending in 7.",
 f:"Greatest number: biggest digits at the front. Odd: last digit odd.",
 s:["End with 5: the rest 7, 4, 2, 0 arranged greatest → 74205.","End with 7: the rest 5, 4, 2, 0 → 54207.","74205 is greater → <b>74205</b>.","(75420 is even, so it can't be the answer.)"]},
{c:4,y:"2017",n:34,q:"The least number that should be subtracted from 370 so that the resulting number is a square number is:",o:["5","9","4","6"],a:1,
 h:"Find the biggest perfect square that is less than 370. 19² and 20² are close.",
 f:"Subtract the number from the nearest perfect square BELOW it.",
 s:["19² = 361 and 20² = 400. The square just below 370 is 361.","370 − 361 = <b>9</b>."]},
{c:9,y:"2017",n:35,q:`Observe the figure and find the value of ♣ + ♥.<div class="fig" style="text-align:center;font-size:22px;font-weight:700;line-height:1.7;margin:8px 0">♣ − ▲ = □ + □<br>□ + ▲ = 9<br>▲ − □ = 1<br>♥ − □ = ♣</div>`,o:["30","20","15","25"],a:0,
 h:"Start with the two easiest lines: □ + ▲ = 9 and ▲ − □ = 1. Find □ and ▲ first, then ♣, then ♥.",
 f:"Each symbol stands for a number. Solve them one by one.",
 s:["▲ = □ + 1 (from ▲ − □ = 1). Put in □ + ▲ = 9: □ + □ + 1 = 9 → □ = <b>4</b>, ▲ = <b>5</b>.","♣ − ▲ = □ + □ → ♣ − 5 = 8 → ♣ = <b>13</b>.","♥ − □ = ♣ → ♥ − 4 = 13 → ♥ = <b>17</b>.","♣ + ♥ = 13 + 17 = <b>30</b>."]},
{c:3,y:"2017",n:36,q:"In the series 1, 3, 7, 15, 31, 63, … what will be the units digit of the 30th term of the series?",o:["1","9","3","5"],a:2,
 h:"Compare the terms with powers of 2: 2, 4, 8, 16, 32, 64. How does each term relate? Then look at the pattern of last digits of powers of 2.",
 f:"nth term = 2ⁿ − 1. Last digits of 2ⁿ repeat every 4: 2, 4, 8, 6.",
 s:["Terms: 2¹−1 = 1, 2²−1 = 3, 2³−1 = 7, 2⁴−1 = 15 … so nth term = 2ⁿ − 1.","Units digit of 2ⁿ repeats: 2, 4, 8, 6 (every 4 steps).","30 ÷ 4 = 7 remainder 2 → 2³⁰ ends in <b>4</b>.","Units digit of 2³⁰ − 1 = 4 − 1 = <b>3</b>."]},
{c:9,y:"2017",n:37,q:"What will be the quotient when 12xy + 8y is divided by 4y?",o:["3y + 2","3x + 2","3xy + 2y","3x + 2y"],a:1,
 h:"Divide EACH part separately by 4y: 12xy ÷ 4y and 8y ÷ 4y. Divide the numbers and cancel the letters.",
 f:"(a + b) ÷ c = a ÷ c + b ÷ c.",
 s:["12xy ÷ 4y = (12 ÷ 4) × x × (y ÷ y) = 3x.","8y ÷ 4y = 2.","Quotient = <b>3x + 2</b>."]},
{c:17,y:"2017",n:38,q:"A train 200 m long passes a pole in 9 seconds. The speed of the train in km/hr is:",o:["90 km/hr","60 km/hr","72 km/hr","80 km/hr"],a:3,
 h:"Passing a pole means covering its own length (200 m). Find the speed in m/s, then change to km/h (× 18/5).",
 f:"Speed = Distance ÷ Time. m/s → km/h: × 18/5.",
 s:[`Speed = 200 ÷ 9 m/s = ${fr("200","9")} m/s.`,`In km/h: ${fr("200","9")} × ${fr("18","5")} = 200 × 2 ÷ 5 = 400 ÷ 5 = <b>80 km/hr</b>.`]},
{c:2,y:"2017",n:39,q:"In which of the following numbers is the digit in the tens place exactly four times the digit in the thousands place?",o:["8621","2386","8326","4538"],a:1,
 h:"For each number, find the thousands digit (1st) and tens digit (3rd). Is the tens digit exactly 4 times the thousands digit?",
 f:"Thousands = 1st digit of a 4-digit number. Tens = 3rd digit.",
 s:["8621: thousands 8, tens 2 ✗.","2386: thousands 2, tens 8 → 8 = 4 × 2 ✓.","8326: thousands 8, tens 2 ✗. 4538: thousands 4, tens 3 ✗.","Answer: <b>2386</b>."]},
{c:20,y:"2017",n:40,q:"The perimeter of a square ground is 120 m. What is its area?",o:["900 sq.m","600 sq.m","300 sq.m","360 sq.m"],a:0,
 h:"Find one side first (perimeter ÷ 4). Then area = side × side.",
 f:"Square: perimeter = 4 × side, area = side × side.",
 s:["Side = 120 ÷ 4 = 30 m.","Area = 30 × 30 = <b>900 sq.m</b>."]}
];

const nestFig18=`<svg class="fig" viewBox="0 0 150 150" width="170" role="img" aria-label="Small square inside a large square, ring shaded"><rect x="10" y="10" width="126" height="126" style="fill:var(--hint);stroke:var(--ink);stroke-width:2.5"/><rect x="42" y="42" width="62" height="62" style="fill:var(--card);stroke:var(--ink);stroke-width:2.5"/></svg>`;
const Q2018=[
{c:20,y:"2018",n:1,q:"If 1 gram of grass seeds is needed to plant 1 sq. metre, how much grass seed will be needed to plant an entire field that is 110 metres long and 70 metres wide?",o:["77 Kg","15 Kg","7.7 Kg","37.5 Kg"],a:2,
 h:"Find the area of the field first (length × width). Each sq. metre needs 1 gram. Then change grams into kilograms (÷ 1000).",
 f:"Area of rectangle = L × B. 1000 grams = 1 kg.",
 s:["Area = 110 × 70 = 7700 sq. m.","Grass seed = 7700 × 1 g = 7700 g.","7700 g ÷ 1000 = <b>7.7 kg</b>."]},
{c:2,y:"2018",n:2,q:"If the digit 2 is placed in between the digits 3 and 5 of the number 43541, by how much is the new number more than the previous number?",o:["20000","38900","389000","200000"],a:2,
 h:"Write the new number first (put 2 between the 3 and the 5), then subtract the old number.",
 f:"Write both numbers neatly and subtract.",
 s:["Old number = 43541. Putting 2 between 3 and 5 gives 4 3 2 5 4 1 = 432541.","Difference = 432541 − 43541 = <b>389000</b>."]},
{c:12,y:"2018",n:3,q:"Given that 15 × 0.005 = 0.075. Find 1.5 × 0.05 × 100.",o:["0.0075","0.075","0.75","7.5"],a:3,
 h:"Count how the numbers changed: 1.5 is 15 ÷ 10 and 0.05 is 0.005 × 10. Or just work it out step by step: 1.5 × 0.05 first, then × 100.",
 f:"Multiplying by 100 moves the decimal point 2 places right.",
 s:["1.5 × 0.05 = 0.075 (15 × 5 = 75, with 3 decimal places).","0.075 × 100 = <b>7.5</b>."]},
{c:9,y:"2018",n:4,q:"The sum of two consecutive odd numbers is 12. Which equation from the following represents the given statement using 'm' as the variable?",o:["m + 2 = 12","m(m + 2) = 12","m + (m + 2) = 12","2m = 12"],a:2,
 h:"Consecutive odd numbers differ by 2. If the first is m, what is the next one? 'Sum' means add them.",
 f:"Consecutive odd numbers: m, m + 2. Sum → m + (m + 2).",
 s:["First odd number = m. Next odd number = m + 2.","Their SUM is 12 → <b>m + (m + 2) = 12</b>.","(Product would be m(m + 2); that is not what the question says.)"]},
{c:1,y:"2018",n:5,q:"A palindrome number is a number which remains the same when read backwards. For example: 707 or 5225. A three-digit palindrome number is added to 2017 to get a 4-digit palindrome number. What is the sum of the digits of the three-digit palindrome number added to 2017?",o:["13","10","11","9"],a:0,
 h:"The answer is between 2118 and 3016, so it starts with 2 (or 3). A palindrome starting with 2 ends with 2. Use the last digit: 7 + (last digit of your number) must end in 2.",
 f:"A palindrome reads the same both ways (like 2552).",
 s:["The 3-digit palindrome looks like a b a. Last digit: 7 + a must end in 2 → <b>a = 5</b>.","So the number is 5b5. 2017 + 5b5 = 2522 + 10b. We want a palindrome 2yy2.","b = 3 gives 2552 — it reads the same backwards ✓. So the number is <b>535</b>.","Sum of digits = 5 + 3 + 5 = <b>13</b>."]},
{c:3,y:"2018",n:6,q:"The given series 13, 16, 19, 22 … is increasing by 3 each time. What will be the 75th number of the series?",o:["88","163","238","235"],a:3,
 h:"nth term = first term + (n − 1) × 3. Remember to use (n − 1), not n.",
 f:"nth term = a + (n − 1) × d.",
 s:["a = 13, d = 3, n = 75.","75th term = 13 + (74 × 3) = 13 + 222 = <b>235</b>."]},
{c:18,y:"2018",n:7,q:"Which of the following statements is true?",o:["The supplementary angle of an angle is always less than 90°.","The complementary angle of an acute angle is always an acute angle.","The complementary and the supplementary angle of a given angle always sum up to 360°.","All the given statements are false."],a:1,
 h:"Test each statement with an example angle like 30°. Complement = 90° − angle, supplement = 180° − angle.",
 f:"Acute angle: less than 90°. Complement = 90° − x. Supplement = 180° − x.",
 s:["Statement 1: supplement of 30° is 150°, which is more than 90° ✗.","Statement 2: if x is acute (between 0° and 90°), 90° − x is also between 0° and 90° → acute ✓.","Statement 3: (90 − x) + (180 − x) = 270 − 2x, which isn't always 360° ✗.","Answer: <b>statement 2</b>."]},
{c:11,y:"2018",n:8,q:`On a number line, point A is at ${fr("1","5")} and point B is at ${fr("1","3")}. Point C is exactly between point A and B. What fraction could be at C?`,o:[fr("1","4"),fr("3","15"),fr("4","15"),fr("1","6")],a:2,
 h:"The point exactly in the middle is the average of the two fractions: add them, then halve. Make the denominators the same first.",
 f:"Midpoint = (first + second) ÷ 2.",
 s:[`${fr("1","5")} = ${fr("3","15")} and ${fr("1","3")} = ${fr("5","15")}.`,`Middle of ${fr("3","15")} and ${fr("5","15")} is ${fr("4","15")} (halfway between 3 and 5 is 4).`,`C = <b>${fr("4","15")}</b>.`]},
{c:19,y:"2018",n:9,q:"The perimeter of a rectangle is 72 cm. The length and breadth of the rectangle are:",o:["9 and 4","14 and 4","19 and 15","21 and 15"],a:3,
 h:"Perimeter = 2 × (L + B), so L + B must be half of 72. Add the two numbers in each option.",
 f:"L + B = Perimeter ÷ 2.",
 s:["L + B = 72 ÷ 2 = <b>36</b>.","9 + 4 = 13 ✗, 14 + 4 = 18 ✗, 19 + 15 = 34 ✗.","21 + 15 = <b>36</b> ✓."]},
{c:13,y:"2018",n:10,q:"Nine men complete a certain work in 32 days, then in how many days will 72 men complete the same work?",o:["28 days","12 days","4 days","6 days"],a:2,
 h:"More men finish faster. 72 men is how many times 9 men? Then divide the days by that number.",
 f:"Men × Days = constant (inverse proportion).",
 s:["Total work = 9 × 32 = 288 man-days.","Days for 72 men = 288 ÷ 72 = <b>4 days</b>.","(72 is 8 times 9, so 32 ÷ 8 = 4 ✓)"]},
{c:20,y:"2018",n:11,q:`The diagram shows a square of perimeter 20 cm inscribed inside a square of perimeter 28 cm. What is the area of the shaded triangle?${sqInSq18}`,o:["6 sq.cm","8 sq.cm","7 sq.cm","10 sq.cm"],a:0,
 h:"Find the side of each square from its perimeter. The four corner triangles share the area between the squares equally.",
 f:"Area between the squares ÷ 4 = area of one corner triangle.",
 s:["Outer side = 28 ÷ 4 = 7 cm → area 49. Inner side = 20 ÷ 4 = 5 cm → area 25.","Four triangles together = 49 − 25 = 24 sq.cm.","One triangle = 24 ÷ 4 = <b>6 sq.cm</b>.","(Check: the triangle has sides 3, 4 and 5 → ½ × 3 × 4 = 6 ✓)"]},
{c:14,y:"2018",n:12,q:"After playing 500 games, Sachin's success rate at Spider Solitaire is 49%. Sachin determines that now on he will win every game. How many extra games does he have to win so that his success rate increases to 50%?",o:["1","5","10","20"],a:2,
 h:"First find how many games he has won so far (49% of 500). Each new game adds 1 win AND 1 to the total. Try the options!",
 f:"Success rate = wins ÷ games played × 100.",
 s:["Wins so far = 49% of 500 = 245.","Try 10 more wins: wins = 255, games = 510 → 255 ÷ 510 = 0.5 = 50% ✓.","(Check 5: 250 ÷ 505 is less than 50% ✗.)","Answer: <b>10 games</b>."]},
{c:11,y:"2018",n:13,q:`Yesterday at a museum, ${fr("4","5")} of the visitors were adults. 120 children visited the museum. ${fr("3","8")} of the adults were male. How many male adults visited the museum?`,o:["120","180","160","200"],a:1,
 h:"If 4/5 are adults, what fraction are children? The 120 children are that fraction of all visitors.",
 f:"Whole = part ÷ fraction.",
 s:[`Children = 1 − ${fr("4","5")} = ${fr("1","5")} of visitors = 120.`,"All visitors = 120 × 5 = 600. Adults = 600 − 120 = 480.",`Male adults = ${fr("3","8")} of 480 = 480 ÷ 8 × 3 = <b>180</b>.`]},
{c:18,y:"2018",n:14,q:"The measure of an angle is (38 − x)°. What will be the measure of the complementary angle of it?",o:["(72 − x)°","(62 − x)°","(52 − x)°","(52 + x)°"],a:3,
 h:"Complementary angles add to 90°. Subtract the angle from 90, and be careful with the minus sign in front of x.",
 f:"Complement = 90° − angle.",
 s:["Complement = 90 − (38 − x).","Remove the bracket: 90 − 38 + x (minus times minus gives plus).","= <b>(52 + x)°</b>."]},
{c:16,y:"2018",n:15,q:"The rate of interest a bank offers for deposit is 6% p.a. S.I. What interest will Rs.8000 earn if deposited for 2 years?",o:["Rs.960","Rs.900","Rs.840","Rs.860"],a:0,
 h:"Use SI = P × R × T ÷ 100. 1% of 8000 is 80.",
 f:"SI = (P × R × T) ÷ 100.",
 s:["1% of 8000 = 80. 6% = 480 per year.","For 2 years = 480 × 2 = <b>Rs.960</b>."]},
{c:7,y:"2018",n:16,q:"Which of the following will be equal to 100?",o:["19 − 5 × 5","(19 − 5) × 5","(19 + 5) × 5","19 × 5 + 5"],a:3,
 h:"Work out each one with BODMAS: brackets first, then multiplication, then + and −.",
 f:"BODMAS: brackets, then × before + and −.",
 s:["19 − 5 × 5 = 19 − 25 = −6 ✗.","(19 − 5) × 5 = 14 × 5 = 70 ✗.","(19 + 5) × 5 = 24 × 5 = 120 ✗.","19 × 5 + 5 = 95 + 5 = <b>100</b> ✓."]},
{c:4,y:"2018",n:17,q:"The sum of the squares of which two numbers will result in a square number?",o:["10 and 15","8 and 15","12 and 15","9 and 16"],a:1,
 h:"Square both numbers in each option, add them, and check whether the total is a perfect square. Remember the famous triple 8, 15, 17!",
 f:"Pythagorean triples: (3,4,5), (5,12,13), (8,15,17), (9,12,15).",
 s:["10² + 15² = 100 + 225 = 325 ✗.","8² + 15² = 64 + 225 = 289 = 17² ✓.","12² + 15² = 144 + 225 = 369 ✗. 9² + 16² = 81 + 256 = 337 ✗.","Answer: <b>8 and 15</b>."]},
{c:19,y:"2018",n:18,q:"The two sides of a square are (3a − 7) cm and (2a − 1) cm. Which of the following can be its perimeter?",o:["21 cm","28 cm","44 cm","42 cm"],a:2,
 h:"All sides of a square are equal, so (3a − 7) = (2a − 1). Solve for a, then find the side and perimeter.",
 f:"Square: all sides equal. Perimeter = 4 × side.",
 s:["3a − 7 = 2a − 1 → a = 6.","Side = 3 × 6 − 7 = 11 cm (check: 2 × 6 − 1 = 11 ✓).","Perimeter = 4 × 11 = <b>44 cm</b>."]},
{c:15,y:"2018",n:19,q:"A shopkeeper buys 6 dozens of long books. He sold 3 dozen at Rs.150 per dozen and the other 3 dozen at Rs.200 per dozen. Finally he made a profit of Rs.180. At what rate per dozen did he buy the long books?",o:["Rs.125","Rs.145","Rs.155","Rs.120"],a:1,
 h:"Find the total he got from selling. Then CP = SP − Profit. Finally share the cost over 6 dozens.",
 f:"CP = SP − Profit.",
 s:["SP = 3 × 150 + 3 × 200 = 450 + 600 = Rs.1050.","CP = 1050 − 180 = Rs.870 for 6 dozen.","Cost per dozen = 870 ÷ 6 = <b>Rs.145</b>."]},
{c:17,y:"2018",n:20,q:"Walking at a speed of 6 km/hr, what distance would he cover in 3 minutes?",o:["300 m","150 m","100 m","200 m"],a:0,
 h:"How many metres does he walk in 1 hour? Then in 1 minute?",
 f:"6 km/h = 6000 m in 60 minutes = 100 m per minute.",
 s:["6 km = 6000 m in 60 minutes.","In 1 minute: 6000 ÷ 60 = 100 m.","In 3 minutes: 3 × 100 = <b>300 m</b>."]},
{c:6,y:"2018",n:21,q:"How many weeks are there in 8 × 7 × 6 × 5 × 4 × 3 × 2 × 1 minutes?",o:["2","3","4","5"],a:2,
 h:"Work out how many minutes there are in ONE week (7 days × 24 hours × 60 minutes). Then divide.",
 f:"1 week = 7 × 24 × 60 = 10080 minutes.",
 s:["8 × 7 × 6 × 5 × 4 × 3 × 2 × 1 = 40320 minutes.","1 week = 7 × 24 × 60 = 10080 minutes.","40320 ÷ 10080 = <b>4 weeks</b>."]},
{c:2,y:"2018",n:22,q:"Using the digits 9, 5, 0, 7 and 3 each only once the greatest 5-digit number is formed. What is the difference between the place value of the digit 5 and 3 in the number formed?",o:["530","470","4970","5030"],a:1,
 h:"Greatest number: biggest digit first, then next biggest … Write the number, then find the place value of 5 and 3 in it.",
 f:"Place value = digit × value of its place.",
 s:["Greatest number = 97530.","5 is in the hundreds place → 500. 3 is in the tens place → 30.","Difference = 500 − 30 = <b>470</b>."]},
{c:11,y:"2018",n:23,q:`Simplify: 1 + ${fr("1","2")} + ${fr("1","4")} + ${fr("1","7")} + ${fr("1","14")} + ${fr("1","28")} = ?`,o:["2","2.5","3","2.6"],a:0,
 h:"Change every fraction into 28ths. 28 is a multiple of 2, 4, 7 and 14.",
 f:"Use the LCM (28) as the common denominator.",
 s:[`1 = ${fr("28","28")}, ${fr("1","2")} = ${fr("14","28")}, ${fr("1","4")} = ${fr("7","28")}, ${fr("1","7")} = ${fr("4","28")}, ${fr("1","14")} = ${fr("2","28")}, ${fr("1","28")}.`,`Total = ${fr("28 + 14 + 7 + 4 + 2 + 1","28")} = ${fr("56","28")} = <b>2</b>.`]},
{c:10,y:"2018",n:24,q:"Find the H.C.F. of 54, 288 and 360.",o:["54","36","18","108"],a:2,
 h:"The HCF must divide all three. Check which options divide 54 first, then test them on 288 and 360.",
 f:"HCF = greatest common factor. Prime factors: 54 = 2 × 3³, 288 = 2⁵ × 3², 360 = 2³ × 3² × 5.",
 s:["54 = 2 × 3 × 3 × 3.","288 = 2 × 2 × 2 × 2 × 2 × 3 × 3.","360 = 2 × 2 × 2 × 3 × 3 × 5.","Common: one 2 and two 3s → 2 × 9 = <b>18</b>."]},
{c:13,y:"2018",n:25,q:"After selling 15 dozens of bananas a man gains Rs.45. How many dozens of bananas should he sell so as to gain Rs.84?",o:["28","24","32","27"],a:0,
 h:"Find how much he gains on just ONE dozen. Then divide 84 by that.",
 f:"Unitary method: gain per dozen = total gain ÷ dozens.",
 s:["Gain per dozen = 45 ÷ 15 = Rs.3.","Dozens for Rs.84 = 84 ÷ 3 = <b>28</b>."]},
{c:8,y:"2018",n:26,q:"Find the value of 'a' in 4a − 5 = 2a + 3.",o:["−2","4","8","3"],a:1,
 h:"Collect the 'a' terms on one side and the numbers on the other. Change the sign when a term crosses the = sign.",
 f:"Same operation on both sides keeps the balance.",
 s:["4a − 2a = 3 + 5.","2a = 8.","a = 8 ÷ 2 = <b>4</b>. Check: 16 − 5 = 11 and 8 + 3 = 11 ✓"]},
{c:9,y:"2018",n:27,q:"Which of the following expressions divides 91abc to get 7c?",o:["13abc","9ab","7ab","13ab"],a:3,
 h:"Divide the numbers (91 ÷ 7) and cancel the letters that appear both on top and at the bottom.",
 f:"If X ÷ Y = Z, then Y = X ÷ Z.",
 s:["We need 91abc ÷ ? = 7c, so ? = 91abc ÷ 7c.","91 ÷ 7 = 13. The letter c cancels: abc ÷ c = ab.","Answer: <b>13ab</b>."]},
{c:12,y:"2018",n:28,q:"A man bought some articles. Which decimal fraction from the below CANNOT represent the number of articles he bought in dozens?",o:["3.75","3.25","3.15","3.5"],a:2,
 h:"Articles must be a whole number. Multiply each decimal by 12 — which one gives a number with a decimal part?",
 f:"Number of articles = dozens × 12 (must be whole).",
 s:["3.75 × 12 = 45 ✓. 3.25 × 12 = 39 ✓. 3.5 × 12 = 42 ✓.","3.15 × 12 = 37.8 ✗ — you can't have 0.8 of an article.","Answer: <b>3.15</b>."]},
{c:19,y:"2018",n:29,q:"The perimeter of an equilateral triangle is (16a + 7b). If a = 2 and b = 4, then the side of the triangle is?",o:["30","20","15","None of these"],a:1,
 h:"Put a = 2 and b = 4 into the perimeter. An equilateral triangle has 3 equal sides.",
 f:"Side of equilateral triangle = Perimeter ÷ 3.",
 s:["Perimeter = 16 × 2 + 7 × 4 = 32 + 28 = 60.","Side = 60 ÷ 3 = <b>20</b>."]},
{c:14,y:"2018",n:30,q:"An article costing Rs.800 is sold at a discount of 20%. What was its sale price?",o:["640","740","780","680"],a:0,
 h:"Find 20% of 800 (the discount). Then subtract it from 800.",
 f:"Sale price = Price − Discount. Or 80% of the price.",
 s:["20% of 800 = 160.","Sale price = 800 − 160 = <b>Rs.640</b>."]},
{c:16,y:"2018",n:31,q:"In how many years will Rs.4000 double at the rate of 12.5% S.I.?",o:["12 years","10 years","8 years","20 years"],a:2,
 h:"'Double' means the interest earned equals the principal (Rs.4000). How much interest does Rs.4000 earn in one year at 12.5%?",
 f:"T = SI × 100 ÷ (P × R). Here SI = P.",
 s:["To double, SI = Rs.4000.","Interest per year = 12.5% of 4000 = Rs.500.","Years = 4000 ÷ 500 = <b>8 years</b>."]},
{c:6,y:"2018",n:32,q:"A three-digit number ♣♣7 is multiplied by a two-digit number ♣8. The digits in ♣ place are not necessarily the same. Which of the following can be the product of the given two numbers?",o:["1906","977706","29405","52606"],a:3,
 h:"Check the last digit (7 × 8). Then check the smallest and the biggest possible product to throw out the rest.",
 f:"Smallest product = 107 × 18 = 1926. Largest product = 997 × 98 = 97,706.",
 s:["Last digit: 7 × 8 = 56 → ends in 6. That removes 29405 (ends in 5).","1906 is smaller than the smallest possible product (1926) ✗.","977706 is bigger than the largest possible product (97,706) ✗.","Only <b>52606</b> is left ✓ (it equals 58 × 907)."]},
{c:1,y:"2018",n:33,q:"If (x + 37) represents an even number, then the 17th odd number prior to it would be?",o:["(x − 4)","(x + 4)","(x + 20)","(x − 20)"],a:1,
 h:"Try a real even number such as 50. The odd numbers BEFORE it are 49, 47, 45 … (going down). Find the 17th and compare.",
 f:"Before an even number e: nth odd number prior = e − 1 − (n − 1) × 2.",
 s:["Let e = x + 37 (even).","17th odd number before e = e − 1 − (16 × 2) = e − 33.","= (x + 37) − 33 = <b>x + 4</b>."]},
{c:4,y:"2018",n:34,q:"The square of 125 is?",o:["14625","13625","15625","17625"],a:2,
 h:"A shortcut for numbers ending in 5: multiply the front digits by (front + 1) and write 25 at the end.",
 f:"(n5)² = n × (n + 1) followed by 25. For 125: n = 12.",
 s:["12 × 13 = 156.","Write 25 after it: <b>15625</b>.","(Check: 125 × 125 = 125 × 100 + 125 × 25 = 12500 + 3125 = 15625 ✓)"]},
{c:14,y:"2018",n:35,q:"Each test at a class is for 80 marks. Total 5 tests were to be conducted. A student has scored 30% marks at the first 4 tests. To have a score of 35% marks on 5 tests, how many marks must he score in the 5th test?",o:["35","40","44","56"],a:2,
 h:"Find the total marks of all 5 tests and the marks he needs for 35%. Then find what he already has from the first 4 tests (30% of their total).",
 f:"Needed in last test = (Target total) − (marks already scored).",
 s:["Total of 5 tests = 5 × 80 = 400. 35% of 400 = 140 marks needed.","First 4 tests total 320 marks; 30% of 320 = 96 scored.","5th test = 140 − 96 = <b>44</b> marks."]},
{c:17,y:"2018",n:36,q:"In what time will a train 100 m long running at a speed of 36 km/hr pass a man standing by the rails?",o:["100 sec","1 min","10 sec","36 sec"],a:2,
 h:"Change 36 km/h to m/s (× 5/18). The train must travel its own length to pass the man.",
 f:"Time = Distance ÷ Speed. km/h → m/s: × 5/18.",
 s:["36 km/h = 36 × 5 ÷ 18 = 10 m/s.","Time = 100 ÷ 10 = <b>10 seconds</b>."]},
{c:7,y:"2018",n:37,q:"Insert the bracket ( ) in the correct place, so that the equation will be true with respect to the BODMAS rule: 3 × 25 − 13 + 4 = 40",o:["(3 × 25)","(25 − 13)","(13 + 4)","(25 − 13 + 4)"],a:1,
 h:"Without brackets the answer is 66. Try each bracket and see which one gives 40.",
 f:"Whatever is inside the bracket is calculated first.",
 s:["(3 × 25): 75 − 13 + 4 = 66 ✗.","(25 − 13): 3 × 12 + 4 = 36 + 4 = <b>40</b> ✓.","(13 + 4): 75 − 17 = 58 ✗. (25 − 13 + 4): 3 × 16 = 48 ✗."]},
{c:8,y:"2018",n:38,q:"If 2x − 3 = 10, then what would be the value of 4x − 5?",o:["8","13","21","None of these"],a:2,
 h:"4x is double 2x. Find 2x first, then double it.",
 f:"4x = 2 × (2x).",
 s:["2x − 3 = 10 → 2x = 13.","4x = 2 × 13 = 26.","4x − 5 = 26 − 5 = <b>21</b>."]},
{c:20,y:"2018",n:39,q:`A small square is drawn in a large square as shown. The area of the shaded region and the area of the unshaded region are each 18 sq.cm. What is the perimeter of the larger square?${nestFig18}`,o:["24 cm","18 cm","36 cm","32 cm"],a:0,
 h:"The shaded ring and the small unshaded square together make up the whole large square. Add their areas, then find the side.",
 f:"Area of square = side × side. Perimeter = 4 × side.",
 s:["Area of large square = 18 + 18 = 36 sq.cm.","Side = 6 cm (since 6 × 6 = 36).","Perimeter = 4 × 6 = <b>24 cm</b>."]},
{c:10,y:"2018",n:40,q:"Find the number that divides 167 and 95 leaving 5 as remainder.",o:["16","18","21","None of these"],a:1,
 h:"If the remainder is 5, then 167 − 5 and 95 − 5 are exactly divisible by the number. Find their HCF. And the divisor must be bigger than 5.",
 f:"Subtract the remainder first, then find the HCF.",
 s:["167 − 5 = 162 and 95 − 5 = 90.","HCF of 162 and 90: 162 = 2 × 3⁴, 90 = 2 × 3² × 5 → HCF = 2 × 9 = <b>18</b>.","18 is more than 5 ✓. Check: 167 = 18 × 9 + 5 and 95 = 18 × 5 + 5 ✓"]}
];

const stairFig19=`<svg class="fig" viewBox="0 0 270 190" width="270" role="img" aria-label="Staircase shape with all right angles"><polyline class="ln" points="30,150 30,80 80,80 80,30 220,30 220,100 150,100 150,150 30,150"/><text x="12" y="120">8</text><text x="85" y="62">3</text><text x="178" y="92">4</text><text x="85" y="170">9</text></svg>`;
const Q2019=[
{c:20,y:"2019",n:1,q:"The length of a rectangle is twice its breadth. If the perimeter of the rectangle is 90 cm, find the area of the rectangle.",o:["225 sq.cm","550 sq.cm","450 sq.cm","600 sq.cm"],a:2,
 h:"If breadth = 1 part then length = 2 parts, so L + B = 3 parts. Half the perimeter gives L + B. Find one part first.",
 f:"L + B = Perimeter ÷ 2. Area = L × B.",
 s:["L + B = 90 ÷ 2 = 45. Since L = 2B: 3B = 45 → B = 15 cm, L = 30 cm.","Area = 30 × 15 = <b>450 sq.cm</b>."]},
{c:15,y:"2019",n:2,q:"When an article was sold for Rs.407 the shopkeeper makes a profit of 10%. What was the cost price of the article?",o:["Rs.366.30","Rs.370","Rs.397","Rs.380"],a:1,
 h:"A 10% profit means the selling price is 110% of the cost price. Find 1% first.",
 f:"CP = SP × 100 ÷ (100 + Profit%).",
 s:["110% of CP = 407 → 1% = 407 ÷ 110 = 3.7.","CP = 3.7 × 100 = <b>Rs.370</b>."]},
{c:12,y:"2019",n:3,q:"Arrange the given decimals in descending order of their values and find the sum of the 1st and the 4th: 0.062, 0.05, 0.56, 0.034, 0.007",o:["0.594","0.057","0.096","0.567"],a:0,
 h:"Write all numbers with 3 decimal places (0.050, 0.560 …) so they are easy to compare. Descending means biggest first.",
 f:"Same number of decimal places makes decimals easy to compare.",
 s:["With 3 decimals: 0.062, 0.050, 0.560, 0.034, 0.007.","Descending: 0.560, 0.062, 0.050, 0.034, 0.007.","1st = 0.56 and 4th = 0.034.","Sum = 0.56 + 0.034 = <b>0.594</b>."]},
{c:16,y:"2019",n:4,q:"What sum of money will yield an interest of Rs.189 in 3 years at 9% p.a. simple interest?",o:["Rs.603","Rs.503","Rs.800","Rs.700"],a:3,
 h:"Use P = SI × 100 ÷ (R × T). First work out R × T = 9 × 3.",
 f:"P = (SI × 100) ÷ (R × T).",
 s:["R × T = 9 × 3 = 27.","P = 189 × 100 ÷ 27 = 18900 ÷ 27 = <b>Rs.700</b>.","(Check: 9% of 700 = 63 a year, × 3 = 189 ✓)"]},
{c:9,y:"2019",n:5,q:"If a = 3, b = 5 and c = b − a, then which of the following expressions has the greatest value?",o:["(a + c) × b","(a + b) × c","(b + c) × a","All are equal"],a:0,
 h:"Find c first (b − a). Then put the numbers into each expression and compare the answers.",
 f:"Substitution: find c, then replace every letter with its number.",
 s:["c = 5 − 3 = <b>2</b>.","(a + c) × b = (3 + 2) × 5 = 25.","(a + b) × c = 8 × 2 = 16. (b + c) × a = 7 × 3 = 21.","Greatest = <b>(a + c) × b</b>."]},
{c:17,y:"2019",n:6,q:"A man walks 900 metres in 18 minutes. How much distance would he cover in an hour?",o:["2 km","3 km","2.5 km","5 km"],a:1,
 h:"Find how far he walks in 1 minute. An hour has 60 minutes. Then change metres to km.",
 f:"Unitary method: distance in 1 minute × 60. 1000 m = 1 km.",
 s:["In 1 minute: 900 ÷ 18 = 50 m.","In 60 minutes: 50 × 60 = 3000 m.","3000 m = <b>3 km</b>."]},
{c:9,y:"2019",n:7,q:"The sum of two consecutive odd numbers is 16. Which equation from the following represents the given statement using 'm' as the variable?",o:["m + 2 = 16","2m = 16","m(m + 2) = 16","m + (m + 2) = 16"],a:3,
 h:"Consecutive odd numbers differ by 2. If one is m, the next is m + 2. 'Sum' means add.",
 f:"Consecutive odd numbers: m, m + 2.",
 s:["First = m, next = m + 2.","Sum = 16 → <b>m + (m + 2) = 16</b>.","(m = 7: 7 + 9 = 16 ✓)"]},
{c:4,y:"2019",n:8,q:"A captain wants to arrange his soldiers in such a way that the number of soldiers in each row is the same as the number of rows. If there are 850 soldiers, how many soldiers will be left out?",o:["19","9","29","39"],a:1,
 h:"Rows × soldiers in each row with both numbers equal means a perfect square. Find the biggest perfect square that is not more than 850.",
 f:"Biggest perfect square ≤ N, then N − that square = left over.",
 s:["29 × 29 = 841 and 30 × 30 = 900 (too many).","Soldiers used = 841.","Left out = 850 − 841 = <b>9</b>."]},
{c:13,y:"2019",n:9,q:"Five persons consume 1 kg of rice in a day. Determine the amount of rice that will be consumed by 20 people in a week.",o:["7 kg","15 kg","28 kg","30 kg"],a:2,
 h:"20 people is how many times 5 people? That tells you the rice for ONE day. A week has 7 days.",
 f:"More people → more rice (direct proportion). 1 week = 7 days.",
 s:["20 ÷ 5 = 4, so 20 people eat 4 × 1 = 4 kg in a day.","In a week: 4 × 7 = <b>28 kg</b>."]},
{c:7,y:"2019",n:10,q:"Where should the bracket ( ) be inserted in the given equation to make it true? 12 − 7 × 5 + 8 = 33",o:["(7 × 5)","(5 + 8)","(7 × 5 + 8)","(12 − 7)"],a:3,
 h:"Without brackets the answer is −15. Try each bracket and see which gives 33.",
 f:"Whatever is inside the bracket is solved first.",
 s:["(7 × 5): 12 − 35 + 8 = −15 ✗.","(5 + 8): 12 − 7 × 13 = 12 − 91 ✗. (7 × 5 + 8): 12 − 43 ✗.","(12 − 7): 5 × 5 + 8 = 25 + 8 = <b>33</b> ✓."]},
{c:11,y:"2019",n:11,q:`Which of the following fractions is equivalent to ${fr("36","54")}?`,o:[fr("14","21"),fr("15","24"),fr("6","14"),fr("7","18")],a:0,
 h:"Simplify 36/54 by dividing top and bottom by the same number (their HCF is 18). Then check the options.",
 f:"Equivalent fractions: same value when simplified.",
 s:[`${fr("36","54")} = ${fr("2","3")} (÷ 18).`,`${fr("14","21")} = ${fr("2","3")} (÷ 7) ✓.`,`Others: ${fr("15","24")} = ${fr("5","8")}, ${fr("6","14")} = ${fr("3","7")}, ${fr("7","18")} is already simplest ✗.`,`Answer: <b>${fr("14","21")}</b>.`]},
{c:18,y:"2019",n:12,q:"The supplementary angle of an obtuse angle will always be:",o:["supplementary angle","acute angle","right angle","reflex angle"],a:1,
 h:"An obtuse angle is between 90° and 180°. Subtract it from 180° — what size range do you get?",
 f:"Supplement = 180° − angle.",
 s:["Obtuse angle x: 90° < x < 180°.","Supplement = 180° − x is between 0° and 90°.","An angle less than 90° is an <b>acute angle</b>."]},
{c:6,y:"2019",n:13,q:"In a basket 104 mangoes are there. If you take out 4 mangoes and replace them by 3 apples, till all mangoes are removed out of the basket, then how many apples will be there in the basket at the end?",o:["78","104","86","92"],a:0,
 h:"How many times can you take out 4 mangoes from 104? Each time puts in 3 apples.",
 f:"Number of swaps = 104 ÷ 4. Apples = swaps × 3.",
 s:["Swaps = 104 ÷ 4 = 26.","Apples = 26 × 3 = <b>78</b>."]},
{c:1,y:"2019",n:14,q:"The 27th even number coming after 27 is?",o:["72","80","86","78"],a:1,
 h:"The first even number after 27 is 28. Then count up in 2s.",
 f:"nth even number after an odd number o = (o + 1) + (n − 1) × 2.",
 s:["1st even number after 27 = 28.","27th = 28 + (26 × 2) = 28 + 52 = <b>80</b>."]},
{c:13,y:"2019",n:15,q:"A five litre can of liquid soap costs Rs.370. What would be the cost of a three litre can of the same liquid soap?",o:["Rs.74","Rs.148","Rs.222","Rs.256"],a:2,
 h:"Find the cost of 1 litre first. Then multiply by 3.",
 f:"Unitary method.",
 s:["1 litre = 370 ÷ 5 = Rs.74.","3 litres = 3 × 74 = <b>Rs.222</b>."]},
{c:14,y:"2019",n:16,q:"If 40% of the students passed the exam, and the number of unsuccessful students were 420. How many students appeared for the exam?",o:["700","280","350","400"],a:0,
 h:"If 40% passed, what percent did NOT pass? 420 students are that percent.",
 f:"Fail % = 100% − Pass %. Find 1% then 100%.",
 s:["Failed = 100% − 40% = 60% = 420 students.","1% = 420 ÷ 60 = 7.","100% = <b>700 students</b>."]},
{c:10,y:"2019",n:17,q:"How many three-digit numbers are there which are divisible by 4, 5 and 6?",o:["14","16","15","17"],a:2,
 h:"Find the LCM of 4, 5 and 6. Then list the three-digit multiples of it (first is 120).",
 f:"Numbers divisible by all three are multiples of the LCM.",
 s:["LCM of 4, 5 and 6 = <b>60</b>.","3-digit multiples: 60 × 2 = 120 (first) … 60 × 16 = 960 (last).","From 2 to 16 → 16 − 2 + 1 = <b>15</b> numbers."]},
{c:18,y:"2019",n:18,q:"An angle measures (35 − x)°, what will be the measure of the complementary angle of it?",o:["(65 − x)°","(65 + x)°","(35 + x)°","(55 + x)°"],a:3,
 h:"Complementary angles add to 90°. Subtract the whole bracket from 90 — watch the sign in front of x!",
 f:"Complement = 90° − angle.",
 s:["Complement = 90 − (35 − x).","Open the bracket: 90 − 35 + x (the minus changes the sign of −x).","= <b>(55 + x)°</b>."]},
{c:11,y:"2019",n:19,q:"Which of the fractions given below is the smallest?",o:[fr("11","12"),fr("10","11"),fr("21","22"),fr("7","6")],a:1,
 h:"7/6 is bigger than 1. For the others, see how far each is from 1: the biggest gap means the smallest fraction.",
 f:"Gap to 1 = (denominator − numerator) ÷ denominator.",
 s:[`7/6 is more than 1, so it's the biggest.`,`Gaps to 1: ${fr("11","12")} is ${fr("1","12")} short, ${fr("10","11")} is ${fr("1","11")} short, ${fr("21","22")} is ${fr("1","22")} short.`,`${fr("1","11")} is the largest gap, so <b>${fr("10","11")}</b> is the smallest.`]},
{c:2,y:"2019",n:20,q:"Using the digits 2, 3, 4 and 5 each only once, all four-digit numbers are made. In how many numbers will the digit 5 be in the hundreds place?",o:["6","8","5","4"],a:0,
 h:"Put 5 in the hundreds place. Then count the ways to arrange the other three digits (2, 3, 4) in the remaining 3 places.",
 f:"Arrangements of 3 different digits = 3 × 2 × 1 = 6.",
 s:["Fix 5 in the hundreds place: _ 5 _ _.","The digits 2, 3, 4 fill the other three places.","First place: 3 choices, next: 2 choices, last: 1 choice → 3 × 2 × 1 = <b>6</b>.","(2534, 2543, 3524, 3542, 4523, 4532)"]},
{c:8,y:"2019",n:21,q:`Find the value of 'm' in the equation ${fr("m + 6","11")} = ${fr("m","9")}`,o:["37","7","27","17"],a:2,
 h:"Cross-multiply: multiply the top of the left fraction by 9 and the top of the right fraction by 11.",
 f:"a/b = c/d → a × d = b × c.",
 s:["9 × (m + 6) = 11 × m.","9m + 54 = 11m.","54 = 2m → m = <b>27</b>. Check: 33 ÷ 11 = 3 and 27 ÷ 9 = 3 ✓"]},
{c:19,y:"2019",n:22,q:"The area of a square and a rectangle are the same. If the side of the square is 15 cm, and the length of the rectangle is 25 cm, then the difference between the perimeter of the square and the rectangle is?",o:["26 cm","10 cm","9 cm","8 cm"],a:3,
 h:"Find the area of the square. Use it to find the rectangle's breadth (area ÷ length). Then find both perimeters and subtract.",
 f:"Breadth = Area ÷ Length. Perimeter of rectangle = 2(L + B). Square = 4 × side.",
 s:["Square area = 15 × 15 = 225 sq.cm.","Rectangle breadth = 225 ÷ 25 = 9 cm.","Rectangle perimeter = 2 × (25 + 9) = 68 cm. Square perimeter = 4 × 15 = 60 cm.","Difference = 68 − 60 = <b>8 cm</b>."]},
{c:17,y:"2019",n:23,q:"At a speed of 72 km/hr a car will cover a distance of 18 km in how much time?",o:["9 min","15 min","24 min","18 min"],a:1,
 h:"Time = Distance ÷ Speed. 18 ÷ 72 is a fraction of an hour. Change that into minutes.",
 f:"Time = Distance ÷ Speed. 1 hour = 60 minutes.",
 s:[`Time = 18 ÷ 72 = ${fr("1","4")} hour.`,`${fr("1","4")} × 60 = <b>15 minutes</b>.`]},
{c:19,y:"2019",n:24,q:"Given below are the sides of equilateral triangles and of squares in each of the alternatives. In which one does the perimeter of the equilateral triangle and the square become equal?",o:["E = 9 & S = 9","E = 8 & S = 9","E = 16 & S = 12","E = 12 & S = 10"],a:2,
 h:"Triangle perimeter = 3 × E. Square perimeter = 4 × S. Work both out for each option.",
 f:"Equilateral triangle: 3 × side. Square: 4 × side.",
 s:["Option 1: 3 × 9 = 27, 4 × 9 = 36 ✗.","Option 2: 24 and 36 ✗.","Option 3: 3 × 16 = 48 and 4 × 12 = 48 ✓.","Option 4: 36 and 40 ✗. Answer: <b>E = 16 & S = 12</b>."]},
{c:14,y:"2019",n:25,q:"A student scored 72% on a test of 25 questions. How many of his answers were wrong?",o:["15","12","9","7"],a:3,
 h:"First find how many he got right (72% of 25). The wrong ones are the rest. Careful: the question asks for WRONG.",
 f:"Wrong = Total − Right.",
 s:["Right = 72% of 25 = 72 × 25 ÷ 100 = 18.","Wrong = 25 − 18 = <b>7</b>."]},
{c:7,y:"2019",n:26,q:"Simplify using the BODMAS rule: {(4 + 2 × 6) ÷ 4} − 4",o:["5","0","1","3"],a:1,
 h:"Do the inside bracket ( ) first — multiplication before addition. Then the { }.",
 f:"Order: ( ) → { } , and inside brackets × before +.",
 s:["2 × 6 = 12 → (4 + 12) = 16.","{16 ÷ 4} = 4.","4 − 4 = <b>0</b>."]},
{c:12,y:"2019",n:27,q:"What decimal of an hour is 12 minutes?",o:["0.20","0.25","0.12","1.2"],a:0,
 h:"There are 60 minutes in an hour. Write 12/60 and change it to a decimal.",
 f:"Decimal of an hour = minutes ÷ 60.",
 s:[`${fr("12","60")} = ${fr("1","5")} = <b>0.20</b>.`]},
{c:18,y:"2019",n:28,q:"The three angles of a triangle are x°, (x + 10)° and (2x − 6)°. Which one of the following is the greatest angle of this triangle?",o:["88°","54°","82°","102°"],a:2,
 h:"Angles of a triangle add up to 180°. Add the three angles and find x. Then work out each angle.",
 f:"Angle sum of a triangle = 180°.",
 s:["x + (x + 10) + (2x − 6) = 180 → 4x + 4 = 180 → 4x = 176 → x = 44.","Angles: 44°, 54°, 82° (check: 44 + 54 + 82 = 180 ✓).","Greatest = <b>82°</b>."]},
{c:13,y:"2019",n:29,q:"A machine produces 150 toys in one minute. How many toys will it produce in 18 seconds?",o:["60","50","25","45"],a:3,
 h:"Find how many toys in 1 second (150 ÷ 60). Then multiply by 18.",
 f:"1 minute = 60 seconds. Unitary method.",
 s:["Toys in 1 second = 150 ÷ 60 = 2.5.","In 18 seconds = 2.5 × 18 = <b>45 toys</b>."]},
{c:2,y:"2019",n:30,q:"Rearrange the digits of the number 75003064 to form the smallest number.",o:["30405067","30004567","34567000","70003456"],a:1,
 h:"The first digit can't be 0 (otherwise it isn't an 8-digit number). Put the smallest NON-zero digit first, then all the zeros, then the rest in increasing order.",
 f:"Smallest number: smallest non-zero digit first, then 0s, then the others in ascending order.",
 s:["Digits: 7, 5, 0, 0, 3, 0, 6, 4 (three zeros).","First digit = smallest non-zero = 3. Then 0, 0, 0.","Then 4, 5, 6, 7 → <b>30004567</b>."]},
{c:16,y:"2019",n:31,q:"If Rs.3200 amounts to Rs.3680 in 3 years, then what is the rate of interest?",o:["5%","3%","16%","8%"],a:0,
 h:"Amount − Principal = interest. Then use R = SI × 100 ÷ (P × T).",
 f:"R = (SI × 100) ÷ (P × T).",
 s:["SI = 3680 − 3200 = Rs.480.","R = 480 × 100 ÷ (3200 × 3) = 48000 ÷ 9600 = <b>5%</b>."]},
{c:5,y:"2019",n:32,q:`In a class of 35 students, exactly 12 play chess and exactly 15 play carrom. 5 students play both chess and carrom. How many students in the class do not play chess or carrom?<div class="note">I read 12 and 15 as the total number playing each game (including those who play both).</div>`,o:["3","10","13","11"],a:2,
 h:"Students who play at least one game = chess + carrom − both (the 5 are counted twice). Then take them away from 35.",
 f:"Union = A + B − Both.",
 s:["Play chess or carrom = 12 + 15 − 5 = 22.","Play neither = 35 − 22 = <b>13</b>."]},
{c:10,y:"2019",n:33,q:"The H.C.F. of 513 and 456 is?",o:["19","38","13","57"],a:3,
 h:"Subtract: 513 − 456 = 57. The HCF divides 57 too. Test whether 57 divides both numbers.",
 f:"HCF also divides the difference of the two numbers.",
 s:["513 − 456 = 57.","513 ÷ 57 = 9 and 456 ÷ 57 = 8 — both exact ✓.","HCF = <b>57</b>."]},
{c:4,y:"2019",n:34,q:"The smallest number that can be added to 1325 to make the resulting number a square number is?",o:["44","11","26","50"],a:0,
 h:"Find the first perfect square above 1325. Try 36² and 37².",
 f:"Next perfect square − the number.",
 s:["36² = 1296 (too small), 37² = <b>1369</b>.","1369 − 1325 = <b>44</b>."]},
{c:15,y:"2019",n:35,q:"A shopkeeper bought a pen for Rs.40 and wishes to sell it at a profit of 25%. What price should he sell the pen for?",o:["Rs.65","Rs.50","Rs.48","Rs.80"],a:1,
 h:"25% is one quarter. Find a quarter of 40 and add it to the cost price.",
 f:"SP = CP + Profit.",
 s:["Profit = 25% of 40 = Rs.10.","SP = 40 + 10 = <b>Rs.50</b>."]},
{c:20,y:"2019",n:36,q:"The three sides of a right-angled triangle are 9 cm, 40 cm and 41 cm. What is the area of this triangle?",o:["180 sq.cm","90 sq.cm","210 sq.cm","820 sq.cm"],a:0,
 h:"In a right-angled triangle the two shorter sides are the base and height. The longest side (41) is the hypotenuse — don't use it for the area.",
 f:"Area of triangle = ½ × base × height.",
 s:["Base = 40 cm and height = 9 cm (the two shorter sides).","Area = ½ × 40 × 9 = <b>180 sq.cm</b>."]},
{c:2,y:"2019",n:37,q:"In the number 87459, how many times is the place value of 7 to that of 5?",o:["100","140","1000","None of these"],a:1,
 h:"Find the place value of 7 (thousands place) and of 5 (tens place). Then divide.",
 f:"Place value = digit × value of its place.",
 s:["In 87459: 7 is in the thousands place → 7000. 5 is in the tens place → 50.","7000 ÷ 50 = <b>140</b> times."]},
{c:5,y:"2019",n:38,q:"At a college the number of girls are 735 which is 145 less than the number of boys in the college. If 435 boys and 375 girls are in the commerce stream, and the remaining in the science stream, then the number of students in the science stream are?",o:["915","785","515","805"],a:3,
 h:"Boys = girls + 145. Find the total students. Subtract the commerce students (435 + 375).",
 f:"Science = Total − Commerce.",
 s:["Boys = 735 + 145 = 880.","Total students = 880 + 735 = 1615.","Commerce = 435 + 375 = 810.","Science = 1615 − 810 = <b>805</b>."]},
{c:19,y:"2019",n:39,q:`The figure given has all corners at right angle. Find the perimeter of the figure.${stairFig19}`,o:["24 units","48 units","36 units","Data insufficient"],a:1,
 h:"For a staircase shape with right-angle corners, the perimeter equals the perimeter of the rectangle that just fits around it. Find that rectangle's width and height.",
 f:"Staircase perimeter = 2 × (total width + total height).",
 s:["Total width = bottom 9 + the 4 on the right = 13.","Total height = 8 on the left + 3 above = 11.","Perimeter = 2 × (13 + 11) = <b>48 units</b>."]},
{c:3,y:"2019",n:40,q:"Which will be the 8th term in the given series of numbers? 10, 12, 15, 20, 27, …",o:["68","51","87","None of these"],a:0,
 h:"Look at the gaps: 2, 3, 5, 7 … These are special numbers! What comes next in that list?",
 f:"The gaps are prime numbers: 2, 3, 5, 7, 11, 13, 17 …",
 s:["Gaps: 12 − 10 = 2, 15 − 12 = 3, 20 − 15 = 5, 27 − 20 = 7 (prime numbers).","Next gaps: 11, 13, 17.","6th = 27 + 11 = 38, 7th = 38 + 13 = 51, 8th = 51 + 17 = <b>68</b>."]}
];

const numLine20=`<svg class="fig" viewBox="0 0 340 90" width="340" role="img" aria-label="Number line with 9 equally spaced points from 5.46 to 7.86"><line class="ln" x1="15" y1="55" x2="325" y2="55"/>${[0,1,2,3,4,5,6,7,8].map(i=>`<circle cx="${25+i*37.5}" cy="55" r="4" style="fill:var(--ink)"/>`).join("")}<text x="25" y="38" text-anchor="middle">5.46</text><text x="${25+3*37.5}" y="38" text-anchor="middle">M</text><text x="325" y="38" text-anchor="middle">7.86</text></svg><div class="note">The line has 9 equally spaced points. M is the 4th point.</div>`;
const sqCells=(cells,u)=>{const mx=Math.max(...cells.map(c=>c[0]))+1,my=Math.max(...cells.map(c=>c[1]))+1;return `<svg class="fig" viewBox="0 0 ${mx*u+20} ${my*u+20}" width="${Math.min(320,mx*u+20)}" role="img" aria-label="Figure made of squares">${cells.map(([x,y])=>`<rect x="${10+x*u}" y="${10+y*u}" width="${u}" height="${u}" style="fill:var(--soft);stroke:var(--ink);stroke-width:2"/>`).join("")}</svg>`;};
const stepSq20=sqCells([[3,0],[4,0],[5,0],[6,0],[0,1],[1,1],[2,1],[7,1],[8,1],[9,1],[0,2],[9,2]],28);
const cutSq20=`<svg class="fig" viewBox="0 0 140 110" width="150" role="img" aria-label="Square cut into two rectangles"><rect class="ln" x="15" y="10" width="90" height="90"/><line x1="15" y1="55" x2="105" y2="55" class="ln" stroke-dasharray="5 4"/></svg>`;
const angFig20=`<svg class="fig" viewBox="0 0 300 110" width="300" role="img" aria-label="Two lines crossing at Q with a third line"><line class="ln" x1="30" y1="20" x2="270" y2="80"/><line class="ln" x1="30" y1="80" x2="270" y2="20"/><line class="ln" x1="110" y1="50" x2="280" y2="50"/><text x="12" y="20">A</text><text x="12" y="96">B</text><text x="143" y="38">Q</text><text x="98" y="55">m</text><text x="205" y="43">r</text><text x="205" y="68">p</text></svg><div class="note">The two lines cross at Q. A third line splits the angle on the right into r and p.</div>`;
const Q2020=[
{c:6,y:"2020",n:1,q:`In the multiplication given, each distinct letter represents a single distinct digit. Find the digit represented by D.${mulTbl20}`,o:["3","1","4","2"],a:0,
 h:"Start at the ones column: 7 × C must end in 8. Carry the tens to the next column and work leftwards, one letter at a time.",
 f:"Column multiplication: find each digit from the right, using the carry.",
 s:["<b>Ones:</b> 7 × C ends in 8 → C = 4 (7 × 4 = 28), write 8, carry 2.","<b>Tens:</b> 7 × B + 2 ends in 9 → B = 1 (7 + 2 = 9), carry 0.","<b>Hundreds:</b> 7 × 6 = 42 → E = 2, carry 4.","<b>Thousands:</b> 7 × A + 4 ends in 9 → A = 5 (35 + 4 = 39), write 9, carry 3.","The carry 3 becomes the first digit → <b>D = 3</b>. (5614 × 7 = 39298 ✓)"]},
{c:9,y:"2020",n:2,q:"On Saturday afternoon Arnav sent 'm' text messages each hour for 5 hours and Pranav sent 'p' text messages each hour for 4 hours. Which of the following represents the total number of messages sent by Arnav and Pranav on Saturday afternoon?",o:["9mp","9(m + p)","5m + 4p","20mp"],a:2,
 h:"Messages = messages per hour × number of hours. Work out Arnav's total and Pranav's total separately, then add them.",
 f:"Total for one person = rate × hours. Different letters can't be combined, so keep them apart.",
 s:["Arnav: m messages × 5 hours = 5m.","Pranav: p messages × 4 hours = 4p.","Total = <b>5m + 4p</b>."]},
{c:14,y:"2020",n:3,q:"If 20% of an electricity bill is deducted, then Rs.100 is still to be paid. How much was the original bill?",o:["Rs.110","Rs.115","Rs.120","Rs.125"],a:3,
 h:"If 20% is taken off, what percent of the bill is left to pay? Rs.100 is that percent.",
 f:"Whole = part ÷ percent × 100.",
 s:["Left to pay = 100% − 20% = 80% of the bill = Rs.100.","1% = 100 ÷ 80 = Rs.1.25.","100% = <b>Rs.125</b>."]},
{c:12,y:"2020",n:4,q:`On the number line given, the points are equally spaced. What number is represented by the point 'M'?${numLine20}`,o:["5.52","6.36","6.66","6.96"],a:1,
 h:"Count the equal gaps between 5.46 and 7.86. Find the length of ONE gap, then see how many gaps M is away from 5.46.",
 f:"Step = (end − start) ÷ number of equal gaps.",
 s:["Total distance = 7.86 − 5.46 = 2.40.","There are 8 equal gaps → one gap = 2.40 ÷ 8 = 0.30.","M is the 3rd gap from 5.46: 5.46 + 3 × 0.30 = 5.46 + 0.90 = <b>6.36</b>."]},
{c:1,y:"2020",n:5,q:"If (x + 21) is an odd number, then find the 3rd even number coming after it.",o:["(x + 24)","(x − 24)","(x + 26)","(x + 27)"],a:2,
 h:"The first even number after an odd number is 1 more. After that, even numbers go up in 2s.",
 f:"After odd number o: 1st even = o + 1, 2nd = o + 3, 3rd = o + 5.",
 s:["1st even number = (x + 21) + 1 = x + 22.","2nd = x + 24.","3rd = x + 26 → <b>(x + 26)</b>."]},
{c:7,y:"2020",n:6,q:"Which of the given expressions has the greatest value?",o:["10 − 3 × 3","(10 + 3) × 3","10 × 3 + 3","3 × 3 + 10"],a:1,
 h:"Work out each expression with BODMAS: brackets first, then ×, then + and −.",
 f:"BODMAS: B, then × before + and −.",
 s:["10 − 3 × 3 = 10 − 9 = 1.","(10 + 3) × 3 = 13 × 3 = <b>39</b>.","10 × 3 + 3 = 33.","3 × 3 + 10 = 19.","Greatest = <b>(10 + 3) × 3</b>."]},
{c:18,y:"2020",n:7,q:"What is the complementary angle of the angle (x − 35)°?",o:["(x + 35)°","(35 − x)°","(125 − x)°","(x − 55)°"],a:2,
 h:"Complementary angles add to 90°. Subtract the whole bracket from 90 — be careful with the signs.",
 f:"Complement = 90° − angle.",
 s:["Complement = 90 − (x − 35).","Open the bracket: 90 − x + 35.","= <b>(125 − x)°</b>."]},
{c:19,y:"2020",n:8,q:`Squares of side 1.5 cm are arranged to form the figure shown. What is the perimeter of the figure?${stepSq20}`,o:["48 cm","45 cm","36 cm","54 cm"],a:1,
 h:"Count the squares, then count the edges that are shared between two squares (those are NOT on the outside). Perimeter = outside edges × 1.5 cm.",
 f:"Outside edges = 4 × (number of squares) − 2 × (shared edges).",
 s:["Number of squares = 4 + 6 + 2 = 12 → 12 × 4 = 48 edges in total.","Shared edges: 3 (top row) + 2 + 2 (middle rows) + 1 + 1 (down to the bottom squares) = 9.","Outside edges = 48 − 2 × 9 = 30.","Perimeter = 30 × 1.5 = <b>45 cm</b>."]},
{c:13,y:"2020",n:9,q:"A man earned Rs.120 when he sold 8 dozens of mangoes. How much would he earn if he sold 20 dozens of mangoes?",o:["Rs.960","Rs.480","Rs.300","Rs.240"],a:2,
 h:"Find the earning on ONE dozen first. Then multiply by 20.",
 f:"Unitary method.",
 s:["1 dozen → 120 ÷ 8 = Rs.15.","20 dozens → 20 × 15 = <b>Rs.300</b>."]},
{c:4,y:"2020",n:10,q:"The nine interior intersection points on a 4 × 4 grid of squares are shown (a 4 × 4 grid has 3 × 3 = 9 interior points). How many interior intersection points are there on a 16 × 16 grid of squares?",o:["225","196","256","144"],a:0,
 h:"A 4 × 4 grid has 3 lines inside each way, giving 3 × 3 points. How many inside lines does a 16 × 16 grid have each way?",
 f:"An n × n grid has (n − 1) × (n − 1) interior points.",
 s:["4 × 4 grid: (4 − 1) × (4 − 1) = 3 × 3 = 9 ✓.","16 × 16 grid: (16 − 1) × (16 − 1) = 15 × 15.","15 × 15 = <b>225</b>."]},
{c:20,y:"2020",n:11,q:"A right-angled triangle has sides measuring 7 cm, 24 cm and 25 cm. Which of the following calculations could work out to be its area in sq.cm?",o:["7 × 24 × 25 ÷ 2","7 × 12","12 × 12.5","3.5 × 12"],a:1,
 h:"The two shorter sides (7 and 24) are the base and the height. The longest side (25) is the hypotenuse and is NOT used for the area.",
 f:"Area of a triangle = ½ × base × height.",
 s:["Base = 7 cm, height = 24 cm.","Area = ½ × 7 × 24 = 7 × 12 (half of 24 is 12).","Answer: <b>7 × 12</b> (= 84 sq.cm)."]},
{c:15,y:"2020",n:12,q:"In April Harry bought a saddle for his horse for Rs.100. In May he sold it for Rs.200. In June he was sorry he had sold it, so he bought it back for Rs.300. In July he got tired of it, so he sold it for Rs.400. Which of the following is the true outcome of his transactions?",o:["Loss of Rs.100","Profit of Rs.100","Profit of Rs.200","No Profit nor Loss"],a:2,
 h:"Add up all the money he RECEIVED when selling and all the money he PAID when buying. Compare.",
 f:"Profit = total money received − total money spent.",
 s:["Money spent (buying) = 100 + 300 = Rs.400.","Money received (selling) = 200 + 400 = Rs.600.","Profit = 600 − 400 = <b>Rs.200</b>."]},
{c:19,y:"2020",n:13,q:`A square is cut along the centre of its side to make two identical rectangles. If the perimeter of each rectangle is 48 cm, then the perimeter of the square is:${cutSq20}`,o:["96 cm","144 cm","72 cm","64 cm"],a:3,
 h:"If the square has side s, each rectangle is s long and s/2 wide. Write the rectangle's perimeter using s and set it equal to 48.",
 f:"Rectangle perimeter = 2 × (L + B) = 2 × (s + s/2) = 3s.",
 s:["Each rectangle: length = s, width = s ÷ 2.","Perimeter = 2 × (s + s/2) = 3s = 48 → s = 16 cm.","Square perimeter = 4 × 16 = <b>64 cm</b>."]},
{c:8,y:"2020",n:14,q:"Find the value of 'x' in the equation 3x + 7 = 1 − 2x",o:[fr("1","5"),`−${fr("7","6")}`,`−${fr("6","5")}`,"−6"],a:2,
 h:"Bring all the x terms to one side and the numbers to the other. Remember: when a term crosses the = sign, its sign changes.",
 f:"Same operation on both sides.",
 s:["3x + 2x = 1 − 7.","5x = −6.",`x = <b>−${fr("6","5")}</b>.`]},
{c:8,y:"2020",n:15,q:"A fruit seller sells only apples (A), mangoes (M) and oranges (O). The total number of A and M with him are 400, the total number of M and O he has is 300, and the total numbers of A and O he has is 440. If he sells 100 fruits of each type, how many fruits of each type are remaining with him?",o:["A = 270, M = 100 & O = 50","A = 170, M = 30 & O = 70","A = 300, M = 200 & O = 140","A = 150, M = 60 & O = 50"],a:1,
 h:"Add the three pair-totals: you count every fruit type twice. Halve it to get the total of all fruits, then find each type.",
 f:"(A + M) + (M + O) + (A + O) = 2 × (A + M + O).",
 s:["Sum of the pairs = 400 + 300 + 440 = 1140 → A + M + O = 570.","O = 570 − 400 = 170. A = 570 − 300 = 270. M = 570 − 440 = 130.","After selling 100 of each: A = 170, M = 30, O = 70.","Answer: <b>A = 170, M = 30 & O = 70</b>."]},
{c:2,y:"2020",n:16,q:"In which of the numbers given below will the difference between the place values of the digits 9 and 7 be 83000?",o:["1907000","109700","197000","91700"],a:2,
 h:"For each number find the place value of 9 and of 7, and subtract. You are looking for 83000.",
 f:"Place value = digit × value of its place (ten-thousands = 10000, thousands = 1000 …).",
 s:["1907000: 9 → 900000, 7 → 7000 → difference 893000 ✗.","109700: 9 → 9000, 7 → 700 → 8300 ✗.","197000: 9 → 90000, 7 → 7000 → 90000 − 7000 = <b>83000</b> ✓.","91700: 9 → 90000, 7 → 700 → 89300 ✗."]},
{c:10,y:"2020",n:17,q:"Three electronic bells beep after every 2, 5 and 8 minutes. If they all beeped together at 10:00 a.m., when will they beep together the next time?",o:["10:40 a.m.","10:32 a.m.","10:30 a.m.","11:20 a.m."],a:0,
 h:"They beep together again after the LCM of 2, 5 and 8 minutes. Add that to 10:00 a.m.",
 f:"LCM tells when repeating events coincide.",
 s:["LCM of 2, 5 and 8 = <b>40</b> minutes.","10:00 a.m. + 40 minutes = <b>10:40 a.m.</b>"]},
{c:16,y:"2020",n:18,q:"In what time will Rs.25 become Rs.37 at 16% p.a. simple interest?",o:["6 months","2 years","3 years","2 years 6 months"],a:2,
 h:"Find the interest needed (37 − 25). Then find how much interest Rs.25 earns in one year at 16%.",
 f:"T = SI × 100 ÷ (P × R).",
 s:["SI needed = 37 − 25 = Rs.12.","Interest in 1 year = 16% of 25 = Rs.4.","Time = 12 ÷ 4 = <b>3 years</b>."]},
{c:11,y:"2020",n:19,q:`If ${fr("5","8")} of the teachers of a coaching class plays chess, ${fr("3","8")} teachers play carrom and ${fr("1","4")} play both chess and carrom. What fraction of the teachers play neither of the two games?`,o:[fr("1","4"),fr("1","8"),fr("1","2"),"0"],a:0,
 h:"Those who play chess or carrom = chess + carrom − both (the 'both' group is counted twice). Then take it away from the whole (1).",
 f:"Union = A + B − Both. Neither = 1 − Union.",
 s:[`Play chess or carrom = ${fr("5","8")} + ${fr("3","8")} − ${fr("1","4")} = 1 − ${fr("1","4")} = ${fr("3","4")}.`,`Neither = 1 − ${fr("3","4")} = <b>${fr("1","4")}</b>.`]},
{c:17,y:"2020",n:20,q:"An ant moves 15 feet per minute. How many feet does it travel in 24 minutes and 40 seconds?",o:["360 ft","370 ft","385 ft","365 ft"],a:1,
 h:"Split the time: 24 minutes and 40 seconds. In 40 seconds the ant covers 2/3 of a minute's distance.",
 f:"Distance = speed × time.",
 s:["24 minutes: 24 × 15 = 360 ft.","40 seconds = ⅔ minute → ⅔ × 15 = 10 ft.","Total = 360 + 10 = <b>370 ft</b>."]},
{c:12,y:"2020",n:21,q:"Krina used her calculator and multiplied a number by 20 instead of by 2. What could she now do to obtain the correct answer?",o:["Divide by 20","Divide by 40","Multiply by 0.5","Multiply by 0.1"],a:3,
 h:"Her answer is how many times too big? Compare 20 with 2. Then do the opposite to fix it.",
 f:"20 is 10 times 2. To undo ×10, divide by 10 (same as × 0.1).",
 s:["Her answer = N × 20. The correct answer = N × 2.","20 ÷ 2 = 10 → her answer is 10 times too big.","Fix: divide by 10, which is the same as <b>multiply by 0.1</b>."]},
{c:9,y:"2020",n:22,q:`If ${fr("a","b")} = 2, what is the value of ${fr("4b","a")}?`,o:["0","1","2","4"],a:2,
 h:"4b/a is the 'flip' of a/b with a 4 on top. Flip 2 to get b/a, then multiply by 4.",
 f:"If a/b = 2 then b/a = 1/2.",
 s:[`b/a = ${fr("1","2")} (the flip of ${fr("a","b")} = 2).`,`${fr("4b","a")} = 4 × ${fr("b","a")} = 4 × ${fr("1","2")} = <b>2</b>.`,"(Check with a = 2, b = 1: 4 × 1 ÷ 2 = 2 ✓)"]},
{c:1,y:"2020",n:23,q:"The sum of two consecutive prime numbers is 42. What is the difference of those two prime numbers?",o:["2","4","5","3"],a:1,
 h:"Each prime is close to half of 42 = 21. List the primes around 21 and find the consecutive pair that adds to 42.",
 f:"Primes near 21: 17, 19, 23, 29.",
 s:["Half of 42 is 21. The primes just below and above 21 are 19 and 23.","19 + 23 = 42 ✓ and there is no prime between them.","Difference = 23 − 19 = <b>4</b>."]},
{c:13,y:"2020",n:24,q:"A man takes up a work to be completed in 30 days for Rs.27000. He works for 18 days and then leaves. If you were the employer, how much would you pay him?",o:["Rs.16000","Rs.18000","Rs.16200","Rs.18400"],a:2,
 h:"Find the pay for ONE day (27000 ÷ 30). Then multiply by the 18 days he actually worked.",
 f:"Unitary method: pay per day × days worked.",
 s:["Pay per day = 27000 ÷ 30 = Rs.900.","Pay for 18 days = 18 × 900 = <b>Rs.16,200</b>."]},
{c:4,y:"2020",n:25,q:"Find the least number that must be added to 1300 so as to get a perfect square number.",o:["61","65","64","69"],a:3,
 h:"Find the first perfect square above 1300. Try 36² and 37².",
 f:"Next perfect square − the number.",
 s:["36² = 1296 (below 1300), 37² = <b>1369</b>.","1369 − 1300 = <b>69</b>."]},
{c:7,y:"2020",n:26,q:"Simplify using BODMAS: 778 − [5 + 3 of (25 − 2 × 10)]",o:["83","738","758","788"],a:2,
 h:"Inside the round bracket do 2 × 10 first, then subtract. 'Of' means multiply, and it comes before the + inside the square bracket.",
 f:"BODMAS: Brackets (innermost first), Of, Division/Multiplication, Addition/Subtraction.",
 s:["2 × 10 = 20 → (25 − 20) = 5.","3 of 5 = 3 × 5 = 15.","[5 + 15] = 20.","778 − 20 = <b>758</b>."]},
{c:20,y:"2020",n:27,q:"The length and width of a rectangle are 12 cm and 8 cm respectively. Another rectangle whose area is the same as the first rectangle has length 16 cm. What could be the width of this rectangle?",o:["8 cm","10 cm","4 cm","6 cm"],a:3,
 h:"Find the area of the first rectangle. The second rectangle has the same area, so divide it by 16.",
 f:"Width = Area ÷ Length.",
 s:["Area = 12 × 8 = 96 sq.cm.","Width = 96 ÷ 16 = <b>6 cm</b>."]},
{c:3,y:"2020",n:28,q:"Ajay writes the sequence: 3, 14, 25, 36, … Which of the following numbers can appear in his sequence?",o:["114","111","110","113"],a:3,
 h:"The sequence goes up by 11 each time, starting from 3. Every term is 3 more than a multiple of 11. Check which option is 3 more than a multiple of 11.",
 f:"Terms = 3 + 11 × (something). So (term − 3) must be divisible by 11.",
 s:["Subtract 3 from each option and test divisibility by 11:","114 − 3 = 111 ✗ (not a multiple of 11). 111 − 3 = 108 ✗. 110 − 3 = 107 ✗.","113 − 3 = 110 = 11 × 10 ✓.","Answer: <b>113</b> (the 11th term)."]},
{c:10,y:"2020",n:29,q:"The H.C.F. of 513, 1134 and 1215 is:",o:["18","27","15","33"],a:1,
 h:"Break each number into prime factors, or test each option: does it divide all three numbers?",
 f:"513 = 3³ × 19, 1134 = 2 × 3⁴ × 7, 1215 = 3⁵ × 5. HCF = common prime factors.",
 s:["Only the prime 3 is common to all three.","Smallest power of 3 in all of them = 3³ = 27.","HCF = <b>27</b>. (513 = 27 × 19, 1134 = 27 × 42, 1215 = 27 × 45 ✓)"]},
{c:16,y:"2020",n:30,q:"Kedar borrowed Rs.12000 from his friend at simple interest. He returned his friend Rs.15600 in full settlement of his loan after 5 years. What was the rate of interest charged by his friend?",o:["6% p.a.","5% p.a.","12% p.a.","8% p.a."],a:0,
 h:"Rs.15600 is the amount (principal + interest). Subtract to find the interest. Then R = SI × 100 ÷ (P × T).",
 f:"R = (SI × 100) ÷ (P × T).",
 s:["SI = 15600 − 12000 = Rs.3600.","R = 3600 × 100 ÷ (12000 × 5) = 360000 ÷ 60000 = <b>6% p.a.</b>"]},
{c:6,y:"2020",n:31,q:"A hospital stores one type of medicine in a 2-decagram container. How many 1-milligram doses are there in a 2-decagram container?",o:["0.002","200","2000","20000"],a:3,
 h:"1 decagram = 10 grams. And 1 gram = 1000 milligrams. Change decagrams to grams, then to milligrams.",
 f:"1 decagram = 10 g = 10,000 mg.",
 s:["2 decagram = 2 × 10 = 20 grams.","20 grams = 20 × 1000 = 20,000 milligrams.","Number of 1 mg doses = <b>20000</b>."]},
{c:14,y:"2020",n:32,q:"What is 5% of 5% of Rs.100?",o:["Rs.0.50","Rs.0.25","Rs.1","Rs.25"],a:1,
 h:"Do it in two steps: first 5% of 100, then 5% of that answer.",
 f:"'Percent of a percent': work out one step at a time.",
 s:["5% of 100 = 5.","5% of 5 = 5 × 5 ÷ 100 = 0.25.","Answer: <b>Rs.0.25</b>."]},
{c:6,y:"2020",n:33,q:"When a number X is divided by 5 the remainder is 2. When another number Y is divided by 5 the remainder is 4. When you divide X + Y by 5, then what should be the remainder?",o:["0","1","2","3"],a:1,
 h:"Pick real numbers: X = 7 (remainder 2) and Y = 9 (remainder 4). Add them and divide by 5.",
 f:"Remainders can be added, then divided by 5 again.",
 s:["Try X = 7 and Y = 9: X + Y = 16.","16 ÷ 5 = 3 remainder 1.","Or: 2 + 4 = 6, and 6 ÷ 5 leaves remainder <b>1</b>."]},
{c:15,y:"2020",n:34,q:"A shopkeeper sold a bat for Rs.600 making a profit of 20%. What was the cost price of the bat?",o:["Rs.480","Rs.580","Rs.540","Rs.500"],a:3,
 h:"With 20% profit, Rs.600 is 120% of the cost price. Find 1% first.",
 f:"CP = SP × 100 ÷ (100 + Profit%).",
 s:["120% of CP = 600 → 1% = 5.","CP = 5 × 100 = <b>Rs.500</b>."]},
{c:18,y:"2020",n:35,q:`In the figure, lines A and B intersect at point Q. If ∠m = 40° and ∠r = 18.5°, what is the value of ∠p?${angFig20}`,o:["58.5°","22.5°","12.5°","21.5°"],a:3,
 h:"When two lines cross, the angles opposite each other (vertically opposite) are equal. The angle opposite to m is made up of r and p together.",
 f:"Vertically opposite angles are equal.",
 s:["The angle vertically opposite to m is also 40°.","That 40° angle is split into r and p: r + p = 40°.","p = 40° − 18.5° = <b>21.5°</b>."]},
{c:1,y:"2020",n:36,q:"The sum of three consecutive natural numbers is 66. Which of the following can be one of the numbers of them?",o:["23","24","17","19"],a:0,
 h:"The middle number of three consecutive numbers is the average: 66 ÷ 3. Then find the numbers on either side.",
 f:"Three consecutive numbers: (n − 1), n, (n + 1) — sum = 3n.",
 s:["Middle number = 66 ÷ 3 = 22.","The numbers are 21, 22 and 23.","Option that matches: <b>23</b>."]},
{c:2,y:"2020",n:37,q:"Jack is reading a book whose pages are numbered from 1. The page numbers of the book have a total of 555 digits. How many pages are there in Jack's book?",o:["221","366","361","291"],a:0,
 h:"Count the digits in stages: pages 1–9 (1 digit each), pages 10–99 (2 digits each), then 3-digit pages. Subtract as you go.",
 f:"Digits used: 9 × 1 + 90 × 2 = 189 up to page 99.",
 s:["Pages 1–9: 9 digits.","Pages 10–99: 90 pages × 2 = 180 digits. Total so far = 189.","Digits left = 555 − 189 = 366 for 3-digit pages → 366 ÷ 3 = 122 pages.","Total pages = 99 + 122 = <b>221</b>."]},
{c:12,y:"2020",n:38,q:`Use the place value to work out the numbers in boxes A and B and then find the difference between A and B.<div class="fig" style="text-align:center;font-size:20px;font-weight:700;line-height:1.8;margin:8px 0">Box A: 5 , 0.03 , 0.002 , 0.7<br>Box B: 0.001 , 2 , 0.3 , 0.06</div><div class="note">Each box lists the parts of a number. Add the parts to make the number.</div>`,o:["3.002","3.371","3.560","3.722"],a:1,
 h:"Add up all the parts in box A to make number A, and all the parts in box B to make number B. Then subtract B from A. Line up the decimal points.",
 f:"A number is the sum of its place values: ones + tenths + hundredths + thousandths.",
 s:["A = 5 + 0.7 + 0.03 + 0.002 = <b>5.732</b>.","B = 2 + 0.3 + 0.06 + 0.001 = <b>2.361</b>.","A − B = 5.732 − 2.361 = <b>3.371</b>."]},
{c:11,y:"2020",n:39,q:`Which of the following fractions is less than ${fr("1","20")}?`,o:[fr("1","10"),fr("1","15"),fr("1","12"),fr("1","22")],a:3,
 h:"For fractions with 1 on top, the BIGGER the bottom number, the SMALLER the fraction. Which bottom number is bigger than 20?",
 f:"Same numerator: larger denominator → smaller fraction.",
 s:["1/10, 1/15, 1/12 all have denominators smaller than 20, so they are bigger than 1/20.","22 is larger than 20, so 1/22 is smaller.","Answer: <b>" + fr("1","22") + "</b>."]},
{c:17,y:"2020",n:40,q:"An insect flies at the rate of 10 m/sec. What is its speed in km/hr?",o:["18 km/hr","60 km/hr","36 km/hr","24 km/hr"],a:2,
 h:"To change m/s into km/h multiply by 18 ÷ 5 (or 3.6).",
 f:"m/s → km/h: × 18/5.",
 s:["10 × 18 ÷ 5 = 10 × 3.6 = <b>36 km/hr</b>.","(In 1 hour = 3600 seconds, it flies 36,000 m = 36 km ✓)"]}
];
